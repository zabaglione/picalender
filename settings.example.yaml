# PiCalendar 設定サンプル（2026-10-01）
# 初回のみ settings.yaml へコピーしてください。既存設定は保持します。
# 標準画面はField Notes。旧画面の設定はclassicでのみ使用します。
# 設定対応表: docs/guides/SETTINGS_STATUS.md

# 画面設定
screen:
  width: 1024              # 画面幅（ピクセル）
  height: 600              # 画面高さ（ピクセル）
  fps: 5                   # フレームレート（CPU使用率軽減のため低く設定）
  fullscreen: true         # フルスクリーン表示
  hide_cursor: true        # この値は未使用。フルスクリーン処理でカーソルを隠す

# 旧classic画面のレイアウト設定（一部のみ対応）
layout:
  clock:
    position: "top-center"    # 位置（top-left, top-center, top-right, center, bottom-left, bottom-center, bottom-right）
    x_offset: 0               # X座標の微調整（ピクセル）
    y_offset: 100             # Y座標の微調整（ピクセル）
  date:
    position: "top-center"    # 位置
    x_offset: 0               # X座標の微調整
    y_offset: 240             # Y座標の微調整
  calendar:
    position: "bottom-right"  # 位置
    x_offset: -30             # X座標の微調整
    y_offset: -30             # Y座標の微調整
  weather:
    position: "bottom-left"   # 位置
    x_offset: 30              # X座標の微調整
    y_offset: -30             # Y座標の微調整
  moon_phase:
    position: "top-right"     # 位置
    x_offset: -100            # X座標の微調整
    y_offset: 40              # Y座標の微調整（カレンダーとの重複回避）

# UI設定（style以外のサイズ・色は主に旧classic用）
ui:
  style: field_notes # field_notes or classic
  margins: # 現行main.pyでは未使用
    x: 24                  # 左右マージン
    y: 16                  # 上下マージン
  clock_font_px: 130       # 時計のフォントサイズ
  date_font_px: 36         # 日付のフォントサイズ
  cal_font_px: 28          # カレンダーのフォントサイズ（推奨：24-32、可読性重視）
  weather_font_px: 22      # 天気のフォントサイズ
  # フォントサイズ選択指針：
  # - 小さめ（22-24）: コンパクト表示、情報密度重視
  # - 標準（26-28）: 推奨サイズ、バランスの良い可読性  
  # - 大きめ（30-32）: 大きく見やすい、高齢者向け
  colors:
    text: [255, 255, 255]       # 通常テキスト色
    sunday: [255, 100, 100]     # 日曜日の色
    saturday: [100, 100, 255]   # 土曜日の色
    weekday: [255, 255, 255]    # 平日の色
    holiday: [255, 80, 80]      # 祝日の色
    background: [0, 0, 0]       # 背景色
    weather_panel: [40, 40, 40] # 天気パネルの背景色
    weather_panel_alpha: 200    # 天気パネルの透明度

# カレンダー設定
calendar:
  first_weekday: "SUNDAY"  # Field Notesの週始まり。classicは日曜固定
  holidays_enabled: true   # 祝日表示のON/OFF
  holidays_country: "JP"   # 国コード（JP=日本）
  show_holiday_names: true # 祝日名の表示（true=表示, false=色のみ）
  rokuyou_enabled: true    # 六曜表示のON/OFF
  show_rokuyou_names: true # 六曜名の表示（true=表示, false=色のみ）
  rokuyou_format: "single" # classicの六曜表示形式（"full", "short", "single"）
  moon_phase_enabled: true # 月相表示のON/OFF
  moon_phase_format: "graphic" # classicの月相表示形式（"emoji", "text", "ascii", "graphic"）

# 旧classic画面の壁紙（ディレクトリは ./wallpapers 固定）
wallpaper:
  fit_mode: "fit"         # fit / fill / stretch
  rotation_seconds: 300   # 切替間隔。0で固定。追加画像は60秒ごとに検出

# 天気設定
weather:
  provider: "openmeteo"    # 現行画面はOpen-Meteo固定。この選択値は未使用
  refresh_sec: 1800        # 更新間隔（秒）= 30分
  timeout_sec: 10          # 現行画面では未使用（取得側で固定）
  timezone: "Asia/Tokyo"   # Field Notesの時刻・月切替・天気
  location:
    # 東京の座標（お住まいの地域に変更してください）
    lat: 35.681236         # 緯度
    lon: 139.767125        # 経度

# 日替わりイラスト（Field Notes / SSH先は非公開のsettings.yamlで指定）
daily_art:
  enabled: false
  refresh_hour: 5          # ローカル時刻。失敗時は前の画像を保持
  ssh_host: "user@art-server.local"
  remote_script: "picalender-artwork/serve_daily_art.py"
  # identity_file: "~/.ssh/id_ed25519"
  themes: {}              # 例: {"2026-12-25": "A quiet winter celebration"}

# キャラクター設定（現行main.pyに未統合）
character:
  enabled: false           # キャラクター表示（true で有効化）
  sprite: "./assets/sprites/char_idle.png"
  frame_width: 128         # フレーム幅
  frame_height: 128        # フレーム高さ
  fps: 8                   # アニメーションFPS

# フォント設定（旧classicのカレンダー・月相用）
fonts:
  main:
    path: "./assets/fonts/NotoSansCJK-Regular.otf"
    fallback: "/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.otf"

# ログ設定（現行main.pyでは未使用。INFO固定）
logging:
  level: "INFO"            # ログレベル (DEBUG, INFO, WARNING, ERROR)
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"

# 主要都市の座標（参考）
